<!doctype html>
<html lang="en">
  <head>

    <!-- =====================================================
         BASIC
    ====================================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="language"
      content="English"
    />

    <meta
      name="author"
      content="HariHire"
    />

    <!-- =====================================================
         PRIMARY SEO
    ====================================================== -->

    <title>
      HariHire - Find Jobs, Hire Talent & Build Your Career
    </title>

    <meta
      name="description"
      content="HariHire is a job portal to find the latest IT, Non-IT, Banking, Government and other jobs. Search jobs, apply online and connect with recruiters."
    />

    <meta
      name="keywords"
      content="HariHire, jobs, job portal, latest jobs, IT jobs, software jobs, banking jobs, government jobs, non IT jobs, fresher jobs, job search, recruitment"
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- =====================================================
         CANONICAL
    ====================================================== -->

    <link
      rel="canonical"
      href="https://harihire.com/"
    />

    <!-- =====================================================
         FAVICON
    ====================================================== -->

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.svg"
    />

    <!-- =====================================================
         OPEN GRAPH
    ====================================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="HariHire - Find Jobs & Build Your Career"
    />

    <meta
      property="og:description"
      content="Find IT, Non-IT, Banking, Government and other job opportunities on HariHire."
    />

    <meta
      property="og:url"
      content="https://harihire.com/"
    />

    <meta
      property="og:site_name"
      content="HariHire"
    />

    <meta
      property="og:image"
      content="https://harihire.com/banner1.jpg.jpg"
    />

    <meta
      property="og:image:alt"
      content="HariHire Job Portal"
    />

    <!-- =====================================================
         TWITTER / X
    ====================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="HariHire - Find Jobs & Build Your Career"
    />

    <meta
      name="twitter:description"
      content="Search and apply for the latest IT, Non-IT, Banking, Government and other jobs on HariHire."
    />

    <meta
      name="twitter:image"
      content="https://harihire.com/banner1.jpg.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="HariHire Job Portal"
    />

    <!-- =====================================================
         THEME / BROWSER
    ====================================================== -->

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <meta
      name="mobile-web-app-capable"
      content="yes"
    />

    <!-- =====================================================
         PERFORMANCE
    ====================================================== -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

  </head>

  <body>

    <!-- =====================================================
         REACT ROOT
    ====================================================== -->

    <div id="root"></div>

    <!-- =====================================================
         VITE ENTRY POINT
    ====================================================== -->

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
